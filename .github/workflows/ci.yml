name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck -S warning \
            bin/dotskills \
            bin/install-skills.sh \
            bin/setup-ai-tools.sh \
            bin/lib/*.sh \
            bin/run-tests.sh \
            install.sh \
            test-validation.sh

      - name: Run test suite
        run: ./bin/run-tests.sh
